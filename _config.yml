baseurl: ""
url: "https://cyoa.dfbr.co.uk"

# GitHub Pages settings
title: "Choose your own adventure world"
description: "AI-Generated Interactive Stories for Early Readers"

# Generate sitemap.xml automatically on each Jekyll build
plugins:
  - jekyll-sitemap

# Exclude files from Jekyll processing (not served on GitHub Pages)
exclude:
  - generator/
  - venv/
  - secret
  - README.md
  - .gitignore
  - .git/
  - LICENSE
  - "*.md"
  - requirements.txt
  - package.json
  - node_modules/

# Include these files (GitHub Pages excludes assets by default)
include:
  - assets/
  - stories/
